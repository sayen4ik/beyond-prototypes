<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Прототипи Потойбіччя</title>
<style>
:root{--bg:#f6f4f0;--card:#fff;--ink:#1d1b19;--mute:#6b665f;--line:#e4dfd6;--tag:#efeae1}
@media (prefers-color-scheme:dark){:root{--bg:#171513;--card:#211e1b;--ink:#f1ede6;--mute:#a59e93;--line:#34302b;--tag:#2c2824}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:920px;margin:0 auto;padding:40px 16px 64px}
h1{font-size:22px;font-weight:600;margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;color:inherit;text-decoration:none}
.card:hover,.card:focus-visible{border-color:var(--ink);outline:none}
.card h2{font-size:17px;font-weight:600;margin:0 0 6px}
.card p{margin:0 0 14px;color:var(--mute);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{background:var(--tag);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--mute)}
</style></head><body><main>
<h1>Прототипи Потойбіччя</h1>
<div class="grid">
<!--CARDS-->
</div>
</main></body></html>
