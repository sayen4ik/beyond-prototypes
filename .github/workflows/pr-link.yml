# Коли відкривають pull request, додає в нього коментар з посиланням на версію цієї гілки на сайті.
name: pr-link
on:
  pull_request:
    types: [opened, reopened]
permissions:
  pull-requests: write
jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          slug="${BRANCH//\//-}"
          url="https://sayen4ik.github.io/beyond-prototypes/branches/$slug/"
          gh pr comment "$PR" --repo "$REPO" --body "Поклацати версію з цієї гілки: $url
          (зʼявляється за хвилину-дві після кожного пушу; основний сайт не змінюється, доки PR не злито)"
